<!DOCTYPE html>
<html lang="en">
<head>
    <title>React Basics</title>
</head>
<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ProductDetail({ name, price, discountPrice, imageSrc }){
            return(<>
                <img src={imageSrc} width="50px" />
                <p>{name}</p>
                {discountPrice ? (<del>Price: ${price}</del>) : (<p>Price: ${price}</p>)}
                {discountPrice && (<p>Discount price: ${discountPrice}</p>)}
                <button>Add to Cart</button><br/><br/><br/>
            </>)
        }

        function App(){
            return (<>
                <ProductDetail name="Cotton socks" price="10.90" imageSrc="images/plain-tshirt.jpg" discountPrice="5.45" />
                <ProductDetail name="Tennis balls"  price="6.00" imageSrc="images/tennis-balls.png" />
                <ProductDetail name="Plain T-Shirt" price="7.99" imageSrc="images/cotton-socks.jpg" />
            </>)
        };

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>
</html>
